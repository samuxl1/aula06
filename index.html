<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <div class="cabecalho">
        <h1> Formulario</h1>
        <h2> Preencha os campos abaixo</h2>
        </div>
<div class= formulario>
    <form action="" method="POST">

<div class="campo">
<label for="Nome"> Nome Completo</label>
<input type="text" id="Nome" name="nome" placeholder="digite seu nome Completo" size="20">
</div>
    
<div class="campo">
<label for="Cidade">Cidade</label>
<input type="text" id="Cidade" name="Cidade" placeholder="digite a Cidade onde reside " size="20">
</div>
    
<div class="campo">
<label for="email">E-mail</label>
<input type="text" id="email" name="email" placeholder="digite o email do usuario" size="20" >
</div>
    
<div class="campo">
<label for="senha">Senha</label>
<input type="password" id="Senha" name="Senha" placeholder="digite a senha do usuario" size="20">
</div>

<div class="campo">
<label for="data">Data de Nascimento</label>
<input type="Date" id="data" name="data" placeholder="digite a senha do usuario" size="20">
</div>

<div class="campo">
<label for="telefone">Telefone</label>
<input type="tel" id="Telefone" name="Telefone" placeholder="(##) #####-####" size="10">
</div>

<div class="campo">
<label for="estado">Estado</label>
<select id="estado" name="estado">
  <option>Rio de Janeiro</option>
  <option>Sao paulo</option>
  <option>Minas Gerais</option>
  <option> Rio Grande Do Sul</option>  
  <option>Ceara</option>
</select>
</div>

<div class="campo">
<label for="titulo-campo">Turno de preferencia</label>


<label class="opcao">
<input type="radio"  name="Turno" value="manha">manha
</label>
<label class="opcao">
    <input type="radio" name="turno" value="tarde">tarde
</label>
<label class="opcao">
 <input type="radio" name="turno" value="noite">noite
</label>

</div>
<div class="campo">
<label for="titulo-campo">interesses</label>
<label class="opcao">
<input type="checkbox"  name="interesses" value="Tecnologia">Tecnologia</label>
<label class="opcao">
    <input type="checkbox" name="interesses" value="design">design</label>
  <label class="opcao">
     <input type="checkbox" name="interesses" value="marketing">marketing</label>

</div>
<div class="campo">
<label for="obs"> Observaçoes</label>
<textarea id="obs" name="obs" rows="3" size="60" placeholder="Escreva aqui seu comentario..."></textarea>
</div>

<div class=imagem>
    <label for="imagem">Escolha a foto do usuario :</label>
    <input type="file" id="imagem" name="imagem" accept="image/png, image/jpeg, image/webp" required>
</div>

<div class="botao">
<button class="button" type="submit">Enviar</button>
</div>


    
    


</form>
</div>
</body>
</html>
